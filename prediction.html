<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter Enterprise Metrics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm max-w-lg mx-auto">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Configure Enterprise Parameters</h3>
            </div>
            <div class="card-body">
                <form action="/predict" method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Workforce Size (Employees)</label>
                            <input type="number" name="employees" class="form-control" value="12000" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Net Income ($)</label>
                            <input type="number" step="any" name="net_income" class="form-control" value="588900000" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Market Capitalization ($)</label>
                            <input type="number" step="any" name="market_cap" class="form-control" value="19365000000" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Legal Units Count</label>
                            <input type="number" name="legal_units_count" class="form-control" value="18" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Direct Subsidiaries Count</label>
                            <input type="number" name="direct_subsidiaries_count" class="form-control" value="9" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Max Hierarchy Depth</label>
                            <input type="number" name="max_hierarchy_depth" class="form-control" value="2" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Jurisdiction ID (Encoded)</label>
                            <input type="number" name="enterprise_group_jurisdiction" class="form-control" value="76" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Company Type ID (Encoded)</label>
                            <input type="number" name="company_type" class="form-control" value="3" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Standalone Structure</label>
                            <select name="is_standalone_entity" class="form-select">
                                <option value="0">No (Group Entity)</option>
                                <option value="1">Yes (Standalone)</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-between">
                        <a href="/" class="btn btn-secondary">Back Home</a>
                        <button type="submit" class="btn btn-success px-5">Run Prediction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
